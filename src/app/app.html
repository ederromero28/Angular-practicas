<h1>Reactive Forms</h1>

<form [formGroup]="movieForm" (ngSubmit)="handleSubmit()">
  <fieldset>
    <label for="movie-name">Name: </label>
    <input type="text" id="movie-name" formControlName="name" placeholder="Name" />
    @if(name.invalid && name.touched) {
      <p class="form-error">The name is required</p>
    }
  </fieldset>

  <fieldset>
    <label for="movie-duration">Duration: </label>
    <input type="number" id="movie-duration" formControlName="duration" placeholder="Duration" />
    @if(duration.hasError("required") && duration.touched) {
      <p class="form-error">The duration is required</p>
    }@else if (duration.hasError("max") && duration.touched) {
      <p class="form-error">The maximum duration is 300 minutes</p>
    }
  </fieldset>

  <fieldset>
    <label for="movie-director">Director: </label>
    <input type="text" id="movie-director" formControlName="director" placeholder="Director" />
  </fieldset>

  <button [disabled]="movieForm.invalid" type="submit">Create Movie</button>
</form>
